name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Secret patterns, the redaction shim, the audit scanner, skill adoption and the capabilities
      # index. The false-positive fixtures matter as much as the catches.
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Capabilities index is current
        run: python scripts/build_capabilities.py --check

      # Dogfood: the engine passes its own commit gate. CI checks out a detached HEAD.
      - name: Preflight on this repo
        run: python scripts/preflight.py --allow-protected-branch .

      # Install end to end into a throwaway home, never the runner's real one.
      - name: Install smoke test (sandboxed home)
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" CROSSBRAIN_HOME="$RUNNER_TEMP/home/.crossbrain"
          mkdir -p "$HOME/.claude" "$HOME/.codex"
          python crossbrain.py install
          python crossbrain.py doctor
          test -f "$HOME/.claude/skills/brain/SKILL.md"
          test -f "$HOME/.agents/skills/project-intake/SKILL.md"
          test -f "$HOME/.claude/skills/capabilities/SKILL.md"
          grep -q "crossbrain:begin" "$HOME/.codex/AGENTS.md"
          python crossbrain.py install   # idempotent
          test "$(grep -c 'crossbrain:begin' "$HOME/.codex/AGENTS.md")" = "1"
          # archify is bundled: installed as a skill in both targets, and it runs with no npm install.
          test -f "$HOME/.claude/skills/archify/SKILL.md"
          test -f "$HOME/.agents/skills/archify/bin/archify.mjs"
          node "$HOME/.claude/skills/archify/bin/archify.mjs" doctor

      # graphify is installed by its own package; crossbrain must drive it for every present agent CLI.
      - name: graphify integration (sandboxed home)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/gh" USERPROFILE="$RUNNER_TEMP/gh" CROSSBRAIN_HOME="$RUNNER_TEMP/gh/.crossbrain"
          mkdir -p "$HOME/.claude" "$HOME/.codex"
          python crossbrain.py install --with-graphify
          test -f "$HOME/.claude/skills/graphify/SKILL.md"
          python crossbrain.py doctor | grep -E "\+ graphify"
          # graphs stay fresh: graph-only hooks rebuild on commit, and never dirty the repo
          R="$RUNNER_TEMP/graph-repo"; mkdir -p "$R" && cd "$R"
          git init -q -b main && git config user.email ci@ci && git config user.name ci
          printf 'def add(a, b):\n    return a + b\n' > m.py && git add -A && git commit -qm init
          python "$GITHUB_WORKSPACE/crossbrain.py" graph status . | grep -q missing
          python "$GITHUB_WORKSPACE/crossbrain.py" hooks install . --graph-only | grep -q "graph hooks installed"
          test -f .git/hooks/post-commit && test ! -f .git/hooks/pre-commit
          python "$GITHUB_WORKSPACE/crossbrain.py" graph update . | grep -q ok
          test -f graphify-out/GRAPH_REPORT.md
          test -z "$(git status --porcelain)"
          python "$GITHUB_WORKSPACE/crossbrain.py" graph status . | grep -qE "^\s+fresh"
          printf 'def sub(a, b):\n    return a - b\n' >> m.py && git commit -qam two
          python "$GITHUB_WORKSPACE/crossbrain.py" graph status .
          python "$GITHUB_WORKSPACE/crossbrain.py" intake-scan . > "$RUNNER_TEMP/audit.md"
          grep -q "code graph: rebuilt now" "$RUNNER_TEMP/audit.md"
